<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ja" lang="ja" />
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="description" content="パソンコンの複数ディスプレイがあるうちの確認用の画面で常時表示しておき、現在の時間、日にち、曜日、予定までの残り時間、今日の予定の時間をアナログ時計、直近3か月のカレンダーをWebブラウザで確認を行う。" />
    <meta name="keywords" content="Webアナログ時計 カレンダー 日本の休日 スケジュール確認 タイマー WEB暦" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>暦＋アナログ時計</title>
    <style>
      @import "./clock02.css";
      @import "./clock02.modal.css";
    </style>
    <link rel="icon" href="data:,">
  </head>
  <body>
    <div id="calendar"></div>
    <div class="clock" inert>
      <div class="clockFace"></div>
      <div class="dateArea"></div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div id="circle_graph_area"></div>
    </div>

    <div class="right-content">
      <button id="demo" aria-label="メニュー開閉"></button>
      <div id="appoiDiv"></div>
      <div id="eventDiv"></div>
      <div id="audioDiv" class="button012"></div>
      <div id="saveDiv" class="button012"></div>
      <div>
        参考サイト
        <ul>
          <li><a href="https://techlife.asahi.com/n/n6e0eb40e78d5">時計</a></li>
          <li><a href="https://qiita.com/kan_dai/items/b1850750b883f83b9bee">暦</a></li>
          <li><a href="https://holidays-jp.github.io">休日</a></li>
          <li><a href="https://fuuno.net/ani/ani89/circle_graph.html">グラフ</a></li>
          <li><a href="https://qiita.com/butakoma/items/2c1c956b63fcf956a137">DB</a></li>
          <li><a href="https://pagespeed.web.dev/">PageSpeed Insights</a></li>
          <li><a href="https://recooord.org/modal-window-on-javascript/">シンプルなモーダル</a></li>
          <li><a href="https://jp-seemore.com/web/3576/">音を鳴らす</a></li>
          <li><a href="https://yukiyuriweb.com/2021/03/12/how-to-handle-notallowederror-in-safari/">音声権限</a></li>
        </ul>
      </div>
    </div>
    
    <div class="modal js-modal" id="modal-top">
      <div class="modal-container" id="modal-container">
        <div class="modal-close js-modal-close" id="modal-close">×</div>
        <div class="modal-content" id="modal-content"></div>
      </div>
    </div>
    
    <div class="message">Ver.14</div>
    <script type="module" language="JavaScript" src="./clock02.js"></script>
  </body>
</html>
