<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時計</title>
    <style>
      @import "./clock02.css";
    </style>
  </head>
  <body>
    <div class="clock" inert>
      <div class="clockFace"></div>
      <div class="dateArea"></div>
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="circle_graph_area"></div>
    </div>
    <div id="calendar"></div>

    <div class="right-content">
      <button id="demo"></button>
      <div class="">
        <input
          type="time"
          id="appointmentIn"
          name="appointment"
          min="08:30"
          max="22:00"
          required />
        <small>タイマー</small>
      </div>
      <a href=""><div class="" id="">予定</div></a>
    </div>

    <script type="text/javascript" language="JavaScript" src="./clock02.js"></script>
  </body>
</html>
