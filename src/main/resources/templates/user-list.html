<table th:fragment="userTable" class="user-table">
    <thead>
        <tr>
            <th></th>
            <th>ID</th>
            <th>Name</th>
            <th>Tickets</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="user,iter : ${users}" th:classappend="${iter.index % 2 == 0} ? 'even' : 'odd'">
            <td>
                <input type="radio" name="userId" th:value="${user.id}" />
            </td>
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td>
                <span th:if="${#lists.isEmpty(user.tickets)}">No tickets</span>
                <ul th:unless="${#lists.isEmpty(user.tickets)}">
                    <li th:each="ticket : ${user.tickets}">
                        <span th:text="${ticket.name}"></span> - <span th:text="${ticket.price}"></span>
                    </li>
                </ul>
            </td>
        </tr>
    </tbody>
</table>
