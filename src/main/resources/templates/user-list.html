<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <table th:fragment="userTable">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Tickets</th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td>
                <span th:if="${#lists.isEmpty(user.tickets)}">No tickets</span>
                <ul th:unless="${#lists.isEmpty(user.tickets)}">
                    <li th:each="ticket : ${user.tickets}">
                        <span th:text="${ticket.name}"></span> - $<span th:text="${ticket.price}"></span>
                    </li>
                </ul>
            </td>
        </tr>
    </table>
</body>
</html>
