<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>
<body>
    <h1>Users</h1>

    <form th:action="@{/api/hello}" method="get">
        <button type="submit">Hello ページへ</button>
    </form>

    <form th:action="@{/users}" method="post">
        <input type="text" name="name" placeholder="Name">
        <button type="submit">Register</button>
    </form>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Tickets</th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td>
                <span th:if="${#lists.isEmpty(user.tickets)}">No tickets</span>
                <ul th:unless="${#lists.isEmpty(user.tickets)}">
                    <li th:each="ticket : ${user.tickets}">
                        <span th:text="${ticket.name}"></span> - $<span th:text="${ticket.price}"></span>
                    </li>
                </ul>
            </td>
        </tr>
    </table>
</body>
</html>
