<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hello</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <h1>Hello Page</h1>

    <p th:text="${message}"></p>

    <div class="hello-container" th:if="${user != null}">
        <h2>ユーザー詳細情報</h2>
        <table class="detail-table">
            <tr>
                <td>ID:</td>
                <td th:text="${user.id}"></td>
            </tr>
            <tr>
                <td>名前:</td>
                <td th:text="${user.name}"></td>
            </tr>
            <tr>
                <td>年齢:</td>
                <td th:text="${user.age}"></td>
            </tr>
            <tr>
                <td>性別:</td>
                <td th:text="${user.gender}"></td>
            </tr>
            <tr>
                <td>住所:</td>
                <td th:text="${user.address}"></td>
            </tr>
            <tr>
                <td>郵便番号:</td>
                <td th:text="${user.postalCode}"></td>
            </tr>
            <tr>
                <td>国籍:</td>
                <td th:text="${user.nationality}"></td>
            </tr>
            <tr>
                <td>登録日:</td>
                <td th:text="${user.createdDate}"></td>
            </tr>
            <tr>
                <td>更新日時:</td>
                <td th:text="${user.updatedDate}"></td>
            </tr>
        </table>
        <h3>チケット</h3>
        <ul>
            <li th:each="t : ${user.tickets}">
                <span th:text="${t.name}"></span> - <span th:text="${t.price}"></span> 円
            </li>
        </ul>
    </div>

    <form th:action="@{/users}" method="get">
        <button type="submit">Users ページへ</button>
    </form>
</body>
</html>
